<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENO Audit</title>
<style>body{font:15px system-ui;background:#0a0e17;color:#e5e7eb;max-width:960px;margin:2rem auto;padding:0 1rem}h1{color:#67e8f9}button{background:#2563eb;color:white;border:0;border-radius:6px;padding:.6rem 1rem;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:1rem}th,td{padding:.6rem;text-align:left;border-bottom:1px solid #334155;vertical-align:top;word-break:break-word}th{color:#94a3b8}#status{color:#94a3b8}</style></head>
<body><h1>ZENO audit trail</h1><p id="status">Loading the latest 100 events…</p><button onclick="loadAudit()">Refresh</button><table><thead><tr><th>Time</th><th>Event</th><th>Action</th><th>Outcome</th></tr></thead><tbody id="events"></tbody></table>
<script>async function loadAudit(){const token=localStorage.getItem('voice_agent_jwt');const status=document.getElementById('status');if(!token){status.textContent='Sign in at the ZENO control page first.';return}const r=await fetch('/api/audit',{headers:{Authorization:'Bearer '+token}});if(!r.ok){status.textContent='Your session is not authorized.';return}const data=await r.json();document.getElementById('events').innerHTML=data.events.reverse().map(e=>`<tr><td>${new Date(e.timestamp).toLocaleString()}</td><td>${e.event}</td><td>${e.action_type||'—'}</td><td>${e.success===undefined?(e.approved?'approved':'denied'):(e.success?'success':'failed')}</td></tr>`).join('');status.textContent=`Showing ${data.events.length} newest events.`}loadAudit();</script></body></html>
