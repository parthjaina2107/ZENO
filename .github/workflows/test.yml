name: Windows tests and documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      JWT_SECRET_KEY: ci-test-only-not-a-production-secret
      ACCESS_TOKEN: ci-test-only-not-a-production-token
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      AWARENESS_ENABLED: 'false'
      TTS_BACKEND: sapi
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-speech.txt -r requirements-awareness.txt -r requirements-dev.txt
      - name: Check documentation and tracked runtime paths
        run: python scripts/check_docs.py
      - name: Require setup review for relevant pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_docs.py --base $env:BASE_SHA
      - name: Run tests without live provider credentials
        env:
          ZENO_DATA_DIR: ${{ runner.temp }}/zeno-test-data
          MEMORY_FILE: ${{ runner.temp }}/zeno-test-memory.json
          LOG_FILE: ${{ runner.temp }}/zeno-tests.log
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: test-results.xml
          if-no-files-found: ignore


  installer:
    name: Windows installer smoke test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the published EXE, launch its dashboard, and uninstall
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1
